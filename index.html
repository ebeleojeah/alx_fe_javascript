<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Quote Generator with Categories</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 30px;
      color: #333;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    #quoteContainer {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: 20px auto;
      text-align: center;
    }

    #controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    input, select, button {
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background: #007bff;
      color: #fff;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    #quoteList {
      margin-top: 20px;
    }

    .quote-item {
      background: #fafafa;
      border-left: 4px solid #007bff;
      padding: 10px;
      margin: 8px 0;
      border-radius: 5px;
      text-align: left;
    }

    .category {
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>Dynamic Quote Generator</h1>

  <div id="controls">
    <input type="text" id="quoteText" placeholder="Enter a new quote" />
    <input type="text" id="quoteCategory" placeholder="Enter category" />
    <button onclick="addQuote()">Add Quote</button>
  </div>

  <div id="filterControls" style="text-align:center; margin-bottom: 20px;">
    <select id="categoryFilter" onchange="filterQuotes()">
      <option value="all">All Categories</option>
    </select>
  </div>

  <div id="quoteContainer">
    <div id="quoteList"></div>
  </div>

  <div style="text-align:center; margin-top:20px;">
    <button onclick="exportToJsonFile()">Export Quotes (JSON)</button>
    <input type="file" id="importFile" accept=".json" onchange="importFromJsonFile(event)" />
  </div>

  <div style="text-align:center; margin-top:20px;">
  <button onclick="exportToJsonFile()">Export Quotes (JSON)</button>
  <input type="file" id="importFile" accept=".json" onchange="importFromJsonFile(event)" />
</div>

<!-- ADD THIS BELOW -->
<div style="text-align:center; margin-top:20px;">
  <button onclick="syncWithServer()">🔄 Sync with Server</button>
  <p id="syncStatus" style="font-size:14px; color:#555; margin-top:10px;"></p>
</div>


  <script src="script.js"></script>
</body>
</html>
